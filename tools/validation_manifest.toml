[[scene]]
name = "dragon_teapot"

[[scene]]
name = "shaderball_metal"

[[scene]]
name = "openpbr_metals"

[[scene]]
name = "openpbr_specular"

[[scene]]
name = "openpbr_coat"

# ── Transmissive / glass (scale-aware gate) ───────────────────────────────────

[[scene]]
name = "shaderball_transmission"

[[scene]]
